name: SSH Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_PROD_HOST }}" >> ~/.ssh/known_hosts

          echo "${{ secrets.SSH_PROD_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to production
        run: |
          rsync -avz --delete \
            --exclude='node_modules/' \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='uploads/' \
            ./ owoade@${{ secrets.SSH_PROD_HOST }}:~/once-pay-be/

          ssh owoade@${{ secrets.SSH_PROD_HOST }} << 'EOF'
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"

            cd ~/once-pay-be

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v

            npm install

            npm run build

            pm2 restart once-pay-be --update-env

            echo "Deployment completed successfully!"
          EOF